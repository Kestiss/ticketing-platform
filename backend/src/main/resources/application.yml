spring:
  application:
    name: ticketing-platform
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    default: local

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ticketing:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
