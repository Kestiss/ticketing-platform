spring:
  datasource:
    url: ${TICKETING_DATABASE_URL:jdbc:postgresql://localhost:5432/ticketing}
    username: ${TICKETING_DATABASE_USERNAME:ticketing}
    password: ${TICKETING_DATABASE_PASSWORD:ticketing_local_only}
  flyway:
    enabled: true

logging:
  level:
    com.ticketingplatform: DEBUG

ticketing:
  wallet:
    presentation-signing-key: ${TICKETING_WALLET_PRESENTATION_SIGNING_KEY:local-development-only-wallet-signing-key-change-me}
